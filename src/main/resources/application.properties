spring.application.name=service-flotte
server.port=8081

# --- MySQL (XAMPP local, utilisateur root sans mot de passe) ---
spring.datasource.url=jdbc:mysql://localhost:3306/bikeflow_flotte
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Eureka (registre des services Bike-Flow) ---
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# --- Kafka (non configure pour l'instant) ---
# Les evenements rental-started / rental-finished seront consommes plus tard,
# quand le contrat d'evenements partage sera disponible. Le serveur Kafka
# local serait spring.kafka.bootstrap-servers=localhost:9092
