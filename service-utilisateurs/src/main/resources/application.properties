spring.application.name=service-utilisateurs
server.port=8081
spring.config.import=optional:configserver:http://localhost:8888

#spring.datasource.url=jdbc:mysql://localhost:3306/bikeflow_utilisateurs?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.url=jdbc:mysql://localhost:3306/bikeflow_utilisateurs
spring.datasource.username=root
spring.datasource.password=123456

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=tp
spring.rabbitmq.password=tp123

# --- Jalon V6 : resilience des appels vers service-flotte ---
# Retry : 3 tentatives maximum, 200 ms d'attente entre deux tentatives
resilience.flotte.tentatives-max=3
resilience.flotte.attente-ms=200
# Circuit breaker : ouverture apres 3 echecs consecutifs, reessai apres 15 s
resilience.flotte.seuil-echecs=3
resilience.flotte.duree-ouverture-ms=15000
resilience.flotte.essais-semi-ouvert=1

# Delai maximum d'un appel Feign (2 s) : un service-flotte arrete echoue vite
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=2000

# --- V4 : idempotence des ecritures (duree de vie d'une Idempotency-Key, en secondes) ---
idempotence.ttl-secondes=600