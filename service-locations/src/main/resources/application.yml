server:
  port: 8082

spring:
  application:
    name: service-locations
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/rental_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

rental:
  tarif-par-km: 2.00

springdoc:
  swagger-ui:
    path: /swagger-ui.html
