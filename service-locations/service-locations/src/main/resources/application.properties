spring.application.name=service-locations
server.port=8082

# --- MySQL (base dediee : bikeflow_locations, creee par docker/mysql-init/init.sql ou automatiquement) ---
spring.datasource.url=jdbc:mysql://localhost:3306/bikeflow_locations
spring.datasource.username=root
spring.datasource.password=123456

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# --- Eureka (registre des services Bike-Flow) ---
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# --- Actuator ---
management.endpoints.web.exposure.include=health,info

# --- Metier ---
rental.tarif-par-km=2.00
